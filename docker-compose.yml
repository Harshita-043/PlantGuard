version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: plantguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantguard
      POSTGRES_PASSWORD: plantguard
      POSTGRES_DB: plantguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu
    container_name: plantguard-backend
    env_file:
      - .env.example
    depends_on:
      - db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend-dev:
    image: node:20-alpine
    container_name: plantguard-frontend-dev
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantguard-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  pgdata:

