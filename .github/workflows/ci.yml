name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt
            backend/requirements-dev.txt

      - name: Install backend test and ML contract dependencies
        run: python -m pip install -r backend/requirements-ml.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        env:
          PLANTGUARD_DEVICE: cpu
          PLANTGUARD_INFERENCE_PROFILE: cpu
          OBJECT_STORAGE_PROVIDER: local
          LOCAL_STORAGE_ROOT: ${{ runner.temp }}/plantguard-test-storage
          JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
        run: python -m pytest -q

  frontend-test:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload frontend production assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  docker-build:
    name: Build production Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend production assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build backend CPU image
        run: docker build --tag plantguard-backend:ci --file backend/Dockerfile.cpu .

      - name: Build frontend production image
        run: docker build --tag plantguard-frontend:ci --file Dockerfile .
        working-directory: frontend
